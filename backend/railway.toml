# Railway service config for the LucidUI backend. Set this service's Root
# Directory to `backend/` in the Railway dashboard/MCP so this file (and the
# Dockerfile next to it) are picked up.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
