[project]
name = "lucidui-backend"
version = "0.1.0"
description = "LucidUI backend: deterministic UI analysis, LLM interpretation, and UIClip comparison."
requires-python = ">=3.11"
readme = "../README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
